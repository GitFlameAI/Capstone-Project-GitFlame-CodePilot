# GitFlame CodePilot — the complete stack.
#
#   cp .env.example .env      # set GITFLAME_CREDENTIAL_KEY and OPENAI_*
#   docker compose up -d      # or: make up
#
# This one file replaces the previous docker-compose.yml +
# docker-compose.dependencies.yml + backend/deploy/docker-compose.full.yml
# split. That split required passing three -f flags in the right order from the
# repository root, and the "base" stack pointed the backend at a mock service
# that did not implement the API the backend calls — so it looked runnable and
# was not. One file, one command, no mock.
#
# Optional monitoring (Prometheus + Alertmanager + Grafana) lives in
# docker-compose.observability.yml and is off unless asked for:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#     --profile observability up -d
#
# Requires the CodeRAG submodule:  git submodule update --init

# Every container writes structured JSON to stdout, so without a size limit the
# json-file driver will quietly fill the VM's disk. 10 MB x 3 files per service
# is the difference between "logs rotate" and "the deployment dies in a month".
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-backend}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    logging: *default-logging
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_INTERNAL_PORT:-8000}"
    # The backend finishes in-flight requests and waits for background indexing
    # before exiting; give it room to do that instead of the docker default of
    # 10 seconds.
    stop_grace_period: 40s
    environment:
      BACKEND_PORT: ${BACKEND_INTERNAL_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gitflame}:${POSTGRES_PASSWORD:-gitflame}@${DATABASE_HOST:-database}:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-gitflame_codepilot}
      REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_INTERNAL_PORT:-6379}/${REDIS_DB:-0}
      AGENT_ENGINE_URL: http://${AGENT_ENGINE_HOST:-agent-engine}:${AGENT_ENGINE_INTERNAL_PORT:-8001}
      AGENT_ENGINE_TIMEOUT_SECONDS: ${AGENT_ENGINE_TIMEOUT_SECONDS:-600}
      TASK_DISPATCH_MODE: ${TASK_DISPATCH_MODE:-redis}
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-gitflame:agent:tasks}
      AGENT_CONSUMER_GROUP: ${AGENT_CONSUMER_GROUP:-gitflame-agent-workers}
      AGENT_QUEUE_MAX_LENGTH: ${AGENT_QUEUE_MAX_LENGTH:-1000}
      GITFLAME_BASE_URL: ${GITFLAME_BASE_URL:-https://api.gitflametest.ru}
      GITFLAME_TIMEOUT_SECONDS: ${GITFLAME_TIMEOUT_SECONDS:-30}
      GITFLAME_CREDENTIAL_KEY: ${GITFLAME_CREDENTIAL_KEY:?set GITFLAME_CREDENTIAL_KEY to a random 32-byte key in .env}
      GITFLAME_CREDENTIAL_KEY_VERSION: ${GITFLAME_CREDENTIAL_KEY_VERSION:-1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost/api}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-codepilot_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      RECOMMENDATION_SERVICE_URL: http://${RECOMMENDATION_SERVICE_HOST:-recommendation-service}:${RECOMMENDATION_SERVICE_INTERNAL_PORT:-7860}
      RECOMMENDATION_SERVICE_TIMEOUT_SECONDS: ${RECOMMENDATION_SERVICE_TIMEOUT_SECONDS:-120}
      RAG_BASE_URL: ${RAG_BASE_URL:-http://${RAG_SERVICE_HOST:-rag-service}:${RAG_INTERNAL_PORT:-8004}}
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_INDEX_TIMEOUT_SECONDS: ${RAG_INDEX_TIMEOUT_SECONDS:-1800}
      RAG_INDEX_WAIT_TIMEOUT_SECONDS: ${RAG_INDEX_WAIT_TIMEOUT_SECONDS:-1800}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-engine:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${BACKEND_INTERNAL_PORT:-8000}/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  agent-worker:
    logging: *default-logging
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    command: ["/app/agent-worker"]
    # A task already running when the worker is stopped is allowed to finish:
    # interrupting a model call wastes the tokens already spent.
    stop_grace_period: 90s
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9100}
      AGENT_ENGINE_URL: http://${AGENT_ENGINE_HOST:-agent-engine}:${AGENT_ENGINE_INTERNAL_PORT:-8001}
      AGENT_ENGINE_TIMEOUT_SECONDS: ${AGENT_ENGINE_TIMEOUT_SECONDS:-600}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gitflame}:${POSTGRES_PASSWORD:-gitflame}@${DATABASE_HOST:-database}:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-gitflame_codepilot}
      REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_INTERNAL_PORT:-6379}/${REDIS_DB:-0}
      AGENT_QUEUE_NAME: ${AGENT_QUEUE_NAME:-gitflame:agent:tasks}
      AGENT_CONSUMER_GROUP: ${AGENT_CONSUMER_GROUP:-gitflame-agent-workers}
      AGENT_QUEUE_MAX_LENGTH: ${AGENT_QUEUE_MAX_LENGTH:-1000}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
      agent-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/agent-worker", "-healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5

  agent-engine:
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/deploy/agent-engine.Dockerfile
    command: ["gitflame-agent-engine"]
    ports:
      - "${AGENT_ENGINE_PORT:-8002}:${AGENT_ENGINE_INTERNAL_PORT:-8001}"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      PORT: ${AGENT_ENGINE_INTERNAL_PORT:-8001}
      AGENT_MODEL: ${AGENT_MODEL:-laguna}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:9000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_FALLBACK_MODEL: ${AGENT_FALLBACK_MODEL:-}
      FALLBACK_OPENAI_BASE_URL: ${FALLBACK_OPENAI_BASE_URL:-}
      FALLBACK_OPENAI_API_KEY: ${FALLBACK_OPENAI_API_KEY:-}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-600}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-180}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_RETRY_BACKOFF_SECONDS: ${MODEL_RETRY_BACKOFF_SECONDS:-0.25}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-12}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-20}
      MAX_TOOL_OUTPUT_CHARS: ${MAX_TOOL_OUTPUT_CHARS:-8192}
      MODEL_CONTEXT_LIMIT: ${MODEL_CONTEXT_LIMIT:-32768}
      MODEL_MAX_COMPLETION_TOKENS: ${MODEL_MAX_COMPLETION_TOKENS:-12000}
      PLAN_MAX_COMPLETION_TOKENS: ${PLAN_MAX_COMPLETION_TOKENS:-6000}
      CODE_MAX_COMPLETION_TOKENS: ${CODE_MAX_COMPLETION_TOKENS:-12000}
      AGENT_SYNTHESIS_RESERVED_STEPS: ${AGENT_SYNTHESIS_RESERVED_STEPS:-3}
      AGENT_ISSUE_RETRIEVAL_CANDIDATE_LIMIT: ${AGENT_ISSUE_RETRIEVAL_CANDIDATE_LIMIT:-50}
      AGENT_ISSUE_RETRIEVAL_TOP_P: ${AGENT_ISSUE_RETRIEVAL_TOP_P:-0.85}
      # Defaults to the running CodeRAG service, same as the backend. Set
      # RAG_BASE_URL to an empty string to run the agent without retrieval.
      RAG_BASE_URL: ${RAG_BASE_URL-http://${RAG_SERVICE_HOST:-rag-service}:${RAG_INTERNAL_PORT:-8004}}
      RAG_API_KEY: ${RAG_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${AGENT_ENGINE_INTERNAL_PORT:-8001}/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  recommendation-service:
    logging: *default-logging
    build:
      context: ./recommendations
    ports:
      - "${RECOMMENDATION_SERVICE_PORT:-8003}:${RECOMMENDATION_SERVICE_INTERNAL_PORT:-7860}"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      PORT: ${RECOMMENDATION_SERVICE_INTERNAL_PORT:-7860}
      AGENT_MODEL: ${AGENT_MODEL:-laguna}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:9000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${RECOMMENDATION_SERVICE_TIMEOUT_SECONDS:-120}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_RETRY_BACKOFF_SECONDS: ${MODEL_RETRY_BACKOFF_SECONDS:-0.25}
      ANALYZERS_ENABLED: ${ANALYZERS_ENABLED:-true}
      ANALYZER_TIMEOUT_SECONDS: ${ANALYZER_TIMEOUT_SECONDS:-90}
      ANALYZER_MAX_REPOSITORY_BYTES: ${ANALYZER_MAX_REPOSITORY_BYTES:-104857600}
      ANALYZER_MAX_OUTPUT_BYTES: ${ANALYZER_MAX_OUTPUT_BYTES:-16777216}
      ANALYZER_MEMORY_LIMIT_MB: ${ANALYZER_MEMORY_LIMIT_MB:-1536}
      ANALYZER_CPU_SECONDS: ${ANALYZER_CPU_SECONDS:-90}
      CPD_MINIMUM_TOKENS: ${CPD_MINIMUM_TOKENS:-75}
      OSV_CACHE_DIR: /var/cache/osv-scanner
    volumes:
      - ${OSV_CACHE_HOST_PATH:-./.cache/osv-scanner}:/var/cache/osv-scanner:ro
    read_only: true
    mem_limit: ${RECOMMENDATION_SERVICE_MEMORY_LIMIT:-3g}
    cpus: ${RECOMMENDATION_SERVICE_CPUS:-2.0}
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${RECOMMENDATION_SERVICE_INTERNAL_PORT:-7860}/ready', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  rag-service:
    logging: *default-logging
    build:
      context: ./coderag
    environment:
      PORT: ${RAG_INTERNAL_PORT:-8004}
      DATABASE_URL: postgresql+psycopg://${CODERAG_DB_USER:-gitflame}:${CODERAG_DB_PASSWORD:-gitflame}@${CODERAG_DATABASE_HOST:-coderag-database}:${CODERAG_DB_INTERNAL_PORT:-5432}/${CODERAG_DB_NAME:-gitflame_coderag}
      # CPU-friendly local default. Production/GPU deployments can override this
      # with jinaai/jina-embeddings-v2-base-code.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_USE_DENSE: ${RAG_USE_DENSE:-true}
      RAG_MAX_INDEX_FILE_BYTES: ${RAG_MAX_INDEX_FILE_BYTES:-500000}
      RAG_MAX_INDEX_PAYLOAD_BYTES: ${RAG_MAX_INDEX_PAYLOAD_BYTES:-20000000}
      RAG_CANDIDATE_TOP_K: ${RAG_CANDIDATE_TOP_K:-50}
      RAG_MIN_RELEVANCE_SCORE: ${RAG_MIN_RELEVANCE_SCORE:-}
      RAG_MAX_CONTEXT_FILES: ${RAG_MAX_CONTEXT_FILES:-20}
      RAG_MAX_CHUNKS_PER_FILE: ${RAG_MAX_CHUNKS_PER_FILE:-3}
      RAG_MAX_CONTEXT_TOKENS: ${RAG_MAX_CONTEXT_TOKENS:-12000}
      RAG_DEDUPLICATE_OVERLAPS: ${RAG_DEDUPLICATE_OVERLAPS:-true}
      RAG_OVERLAP_THRESHOLD: ${RAG_OVERLAP_THRESHOLD:-0.8}
    ports:
      - "${RAG_PORT:-8004}:${RAG_INTERNAL_PORT:-8004}"
    volumes:
      - coderag_model_cache:/root/.cache/huggingface
    depends_on:
      coderag-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${RAG_INTERNAL_PORT:-8004}/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  database:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitflame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitflame}
      POSTGRES_DB: ${POSTGRES_DB:-gitflame_codepilot}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applied by Postgres only on the first start of an empty volume. For an
      # existing database, apply backend/db/migrations/*.sql by hand — see
      # docs/OPERATIONS.md.
      - ./backend/db/migrations/initial_schema.sql:/docker-entrypoint-initdb.d/initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitflame} -d ${POSTGRES_DB:-gitflame_codepilot}"]
      interval: 2s
      timeout: 5s
      retries: 20

  coderag-database:
    logging: *default-logging
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${CODERAG_DB_NAME:-gitflame_coderag}
      POSTGRES_USER: ${CODERAG_DB_USER:-gitflame}
      POSTGRES_PASSWORD: ${CODERAG_DB_PASSWORD:-gitflame}
    ports:
      - "${CODERAG_DATABASE_PORT:-5433}:5432"
    volumes:
      - coderag_postgres_data:/var/lib/postgresql/data
      - ./coderag/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CODERAG_DB_USER:-gitflame} -d ${CODERAG_DB_NAME:-gitflame_coderag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  coderag_postgres_data:
  coderag_model_cache:
