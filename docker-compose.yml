services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-backend}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:-8000}
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_INTERNAL_PORT:-8000}"
    environment:
      BACKEND_PORT: ${BACKEND_INTERNAL_PORT:-8000}
      ML_SERVICE_URL: http://${ML_SERVICE_HOST:-ml-service}:${ML_SERVICE_INTERNAL_PORT:-8001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gitflame}:${POSTGRES_PASSWORD:-gitflame}@${DATABASE_HOST:-database}:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-gitflame_codepilot}
      REDIS_URL: redis://${REDIS_HOST:-redis}:${REDIS_INTERNAL_PORT:-6379}/${REDIS_DB:-0}
    depends_on:
      ml-service:
        condition: service_started
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml_service
    ports:
      - "${ML_SERVICE_PORT:-8001}:${ML_SERVICE_INTERNAL_PORT:-8001}"
    environment:
      PORT: ${ML_SERVICE_INTERNAL_PORT:-8001}
