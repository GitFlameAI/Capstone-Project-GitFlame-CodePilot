# Alertmanager configuration for the opt-in observability profile.
#
# By default every alert is grouped and dropped into a null receiver, so
# Alertmanager always starts cleanly and alerts stay visible in Prometheus and
# Grafana. Delivery is one edit away and deliberately not driven by an
# environment variable: Alertmanager does not expand variables in this file, and
# a config that fails to parse would take the whole profile down.
#
# To deliver alerts:
#   1. uncomment the `webhook` receiver below and set a real URL
#      (Slack incoming webhook, Mattermost, or a Telegram bridge);
#   2. change `receiver: null-receiver` to `receiver: webhook`;
#   3. docker compose --profile observability up -d alertmanager
route:
  receiver: null-receiver
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: null-receiver

  # - name: webhook
  #   webhook_configs:
  #     - url: https://example.invalid/hooks/codepilot
  #       send_resolved: true

inhibit_rules:
  # A service that is completely down will also fail its dependency checks and
  # stop serving requests; only the root cause is worth paging on.
  - source_matchers: [alertname = CodePilotServiceDown]
    target_matchers: [severity = warning]
    equal: [deployment]
