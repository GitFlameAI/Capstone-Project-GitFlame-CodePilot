# Prometheus configuration for the opt-in observability profile.
#
# Targets are resolved over the Docker network, which is why no port is exposed
# for any /metrics endpoint: only containers on this network can scrape them.
#
# To point an existing Prometheus at a CodePilot deployment instead of running
# this one, copy the scrape_configs block below and replace the hosts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: gitflame-codepilot

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: codepilot-backend
    static_configs:
      - targets: ["backend:8000"]

  - job_name: codepilot-agent-worker
    static_configs:
      - targets: ["agent-worker:9100"]

  - job_name: codepilot-agent-engine
    static_configs:
      - targets: ["agent-engine:8001"]

  - job_name: codepilot-recommendation-service
    static_configs:
      - targets: ["recommendation-service:7860"]
