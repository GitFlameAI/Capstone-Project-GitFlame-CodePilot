[project]
name = "gitflame-recommendation-service"
version = "0.1.0"
description = "GitFlame CodePilot recommendation service and SERGE-based Agent Engine"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "semgrep==1.164.0",
  "uvicorn>=0.34,<1",
]

[project.scripts]
gitflame-recommendations = "recommendation_service.app:run"
gitflame-agent-engine = "agent_engine.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recommendation_service", "src/agent_engine"]
